[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "red-chamber-world-harness"
version = "0.2.0b5"
description = "Executable narrative-world harness for post-80-chapter Dream of the Red Chamber reconstruction"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rcwh = "rcwh.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
