[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcw"
version = "0.4.0"
description = "《红楼梦》八十回后续书的写作工具"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
model = ["anthropic>=2.12"]
dev = ["pytest>=8"]

[project.scripts]
rcw = "rcw.cli:main"

[tool.setuptools]
packages = ["rcw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
