version: 0.1
anti_patterns:
  explicit_self_explanation:
    severity: fail
    examples:
      - "终于明白"
      - "这才懂得人生"
      - "看破红尘"
  encyclopedia_voice:
    severity: fail
    description: "Characters or narrators must not become a vehicle for textbook exposition."
  cultural_kpi:
    severity: fail
    description: "Do not enforce one poem, one cultural artifact, or one philosophical beat per chapter."
  synchronized_emotion:
    severity: warn
    description: "Avoid making all characters react in the same emotional register."
  neat_symbolism:
    severity: warn
    description: "Objects may recur and change meaning, but the narrator should not explain their symbolism."
required_texture_dimensions:
  - mundane_labor
  - food_or_medicine_or_clothing
  - information_asymmetry
  - minor_character_agency
  - material_objects
  - humor_or_friction_when_natural
blind_read_questions:
  - "Would this scene still be worth reading if all evidence labels were hidden?"
  - "Can speakers be distinguished if names are removed?"
  - "If cultural detail is deleted, does character or drama become thinner?"
  - "Does the scene leave something unresolved that should remain unresolved?"
