version: 0.1
principles:
  - id: evidence_floor_not_ceiling
    text: "Hard evidence constrains; underdetermined space may be generated from character, era, structure, and literary fitness."
  - id: no_reverse_evidence
    text: "A reconstruction implementation never upgrades itself into evidence."
  - id: open_is_a_result
    text: "OPEN-LOCKED means current evidence does not uniquely determine the answer; this is not pending work."
  - id: character_local_knowledge
    text: "Characters may only act or speak from their own knowledge state, inference, error, rumor, or perception."
  - id: culture_must_do_work
    text: "Poetry, medicine, ritual, religion, art, and material culture must perform dramatic or character work; no museum display."
  - id: ambiguity_preserved
    text: "Do not resolve an ambiguity merely because the generator can invent an answer."
  - id: staging_before_active
    text: "Candidate prose is staging until regression, P-Lock, and blind-read gates pass."
authority_chain:
  - witness_provenance
  - evidence_role
  - modality
  - literal_target
  - placement
  - evidence_class
  - implementation
  - p_lock
  - candidate_generation
