      file_sha256: 4645da79b1bed76f54be281c50b5df648f599ea41541fb7855685753b6a85320
      lines: "2189-2265"
    implementation_refs:
      - impl:active:ch97:miaoyu-xichun-open-scope
    upstream_context:
      open_interface_refs: [OL-018, OL-019]
      decision_refs: [decision:w2:miaoyu-guazhou]
    exact_anchors:
      - text: 从前也有数。
        mode: P1_DIALOGUE
      - text: 只是不用你看着数罢了。
        mode: P1_DIALOGUE
      - text: 谁同你说我件件想得明白？
        mode: P1_DIALOGUE
    required_features:
      - id: shared-water
        mode: PRESERVE_FUNCTION
        description: 妙玉仍能辨水与气味，却必须进入共享水量、热水不足等共同资源约束。
      - id: counted-oil
        mode: PRESERVE_OBJECT_CHAIN
        description: 灯油“有数”要把从前的精洁生活与今日共同账目连接起来。
      - id: basin-dedicated-to-shared
        mode: PRESERVE_SEQUENCE
        description: 白瓷盆从专洗茶具、拒借，到因粗钵破裂而暂借盛灰、洗净归还、次日仍继续使用，形成物件递进。
      - id: xichun-not-total-clarity
        mode: PRESERVE_CONTRAST
        description: 惜春出家后仍保留忘记丢梳子、纸背再用、择菜搬物等不整齐处，不把她写成件件想明白的清冷圣人。
    forbidden_drift:
      - 不得用“终于明白”“入尘”“看破”等哲学独白总结妙玉变化。
      - 不得把妙玉突然写成毫无洁癖、毫无边界的随和人物。
      - 不得从W2瓜州线生成本回渡口、被掳或死亡传奇。
      - 不得把惜春写成自我解释完整、精神无剩余的人物。
    replacement_rule: COMPETITION_PLUS_SIX_FIELD_PLUS_PLOCK_PLUS_BLIND_READ

