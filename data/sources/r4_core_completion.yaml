sources:
  - id: src:jimao:ch18:daiyu-death
    type: EARLY_COMMENT
    tier: W1_DIRECT
    title: 己卯本第十八回夹批——《离魂》伏黛玉死
    witness:
      siglum: JIMAO
      label: 己卯本
      annotation: 己夹
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      chapter: 18
      pdf_page: 266
      parsed_lines: "7574-7587"
    text: '第四出《离魂》。己夹《牡丹亭》中。伏黛玉死。◇所点之戏剧伏四事，乃通部书之大过节、大关键。'
    text_sha256: 831c17f6dd030e4262b7b05cf5df9c5724f4f1de13a3e3b59b80c661cbe6de6f
    notes: 锁黛玉死亡方向，不锁具体回次、病程日数或临终写法。

  - id: src:gengchen:ch27:xiaohong-great-help
    type: EARLY_COMMENT
    tier: W1_DIRECT
    title: 庚辰本第二十七回总评——红玉后有宝玉大得力处
    witness:
      siglum: GENGCHEN
      label: 庚辰本
      annotation: 第二十七回批语
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      chapter: 27
      pdf_page: 400
      parsed_lines: "11565-11578"
    text: '且红玉后有宝玉大得力处，此于千里外伏线也。'
    text_sha256: f89dd2b5b05c4991f17a5367a4b1c2467fffaa9f589d149e0bccee310dc1854b
    notes: 锁“小红/红玉后有宝玉大得力处”的未来功能，不锁具体帮助方式与回次。
