sources:
  - id: src:w2:jingcang:145:duijing-dao-piner
    type: EARLY_TRANSCRIPT
    tier: W2_TRANSCRIPT
    title: 毛国瑶抄录靖藏本第145条——对景悼颦儿
    witness:
      siglum: JINGCANG_MAO_145
      label: 靖藏本批语（毛国瑶抄录）
      annotation: 第七十九回墨眉；原靖藏本已失
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      appendix: 3
      transcript_item: 145
      pdf_page: 1140
      parsed_lines: "33227-33242"
    text: '先为对景悼颦儿作引'
    text_sha256: 14e80a021f9afaff8cd8de87a78c9b3009dafa9e0b658eeb768842525f7fdc68
    transmission:
      original_status: LOST
      intermediary: 毛国瑶横行练习簿过录
      published: 南京师范学院《文教资料简报》1974年八、九月合刊
    notes: 汇校本附录明确称靖藏本后迷失，只有毛国瑶一人亲见，且后世存在真伪质疑；因此只按W2弱见证使用。

  - id: src:w2:jingcang:92:yunge-tan-an
    type: EARLY_TRANSCRIPT
    tier: W2_TRANSCRIPT
    title: 毛国瑶抄录靖藏本第92条——芸哥仗义探庵
    witness:
      siglum: JINGCANG_MAO_92
      label: 靖藏本批语（毛国瑶抄录）
      annotation: 第二十四回回首批；原靖藏本已失
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      appendix: 3
      transcript_item: 92
      pdf_page: 1136
      parsed_lines: "33076-33091"
    text: '醉金刚一回文字伏芸哥仗义探庵余卅年来得遇金刚之样人不少不及金刚者亦复不少惜不便一一注明耳壬午孟夏'
    text_sha256: 6a68b610944064485fa3907e445dc4fb0b3ea7f4ac5eec0f01a8e891a47bf385
    transmission:
      original_status: LOST
      intermediary: 毛国瑶横行练习簿过录
    notes: W2弱见证；“仗义探庵”不能独立锁死具体庵址、行为方式、回次或原标题。

  - id: src:w2:jingcang:102:yumiao-xiangfeng
    type: EARLY_TRANSCRIPT
    tier: W2_TRANSCRIPT
    title: 毛国瑶抄录靖藏本第102条——狱庙相逢
    witness:
      siglum: JINGCANG_MAO_102
      label: 靖藏本批语（毛国瑶抄录）
      annotation: 第四十二回墨眉；原靖藏本已失
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      appendix: 3
      transcript_item: 102
      pdf_page: 1137
      parsed_lines: "33108-33123"
    text: '应了这话固好批书人焉能不心伤狱庙相逢之日始知遇难成祥逢凶化吉实伏线于千里哀哉伤哉此后文字不忍卒读辛卯冬日'
    text_sha256: 885cbd3878a2c4bffc5f79c5aa8e8e74d192e23fc843036c5a7affea1475d277
    transmission:
      original_status: LOST
      intermediary: 毛国瑶横行练习簿过录
    notes: 只可作为狱庙/遇难成祥线的弱增权，不可单独承担人物、救援机制或回次锁定。

  - id: src:w2:jingcang:98:miaoyu-guazhou
    type: EARLY_TRANSCRIPT
    tier: W2_TRANSCRIPT
    title: 毛国瑶抄录靖藏本第98条——妙玉瓜州渡口
    witness:
      siglum: JINGCANG_MAO_98
      label: 靖藏本批语（毛国瑶抄录）
      annotation: 第四十一回墨眉；原靖藏本已失；原抄有缺字
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      appendix: 3
      transcript_item: 98
      pdf_page: 1136
      parsed_lines: "33099-33114"
    text: '妙玉偏辟处此所谓过洁世同嫌也他日瓜州渡口劝惩不哀哉屈从红颜固能不枯骨□□□'
    text_sha256: a89a3a8f7415bb9cbfb3a3f801f506dafd97142e727426cf5308ac3e92c11d44
    transmission:
      original_status: LOST
      intermediary: 毛国瑶横行练习簿过录
    notes: 原抄缺字且为W2；不得据此自动生成渡口、被掳、死亡地点等完整因果链。

  - id: src:w2:jingcang:144:zheng-qianyuan
    type: EARLY_TRANSCRIPT
    tier: W2_TRANSCRIPT
    title: 毛国瑶抄录靖藏本第144条——证前缘回黛玉逝后诸文
    witness:
      siglum: JINGCANG_MAO_144
      label: 靖藏本批语（毛国瑶抄录）
      annotation: 第七十九回墨眉；原靖藏本已失
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      appendix: 3
      transcript_item: 144
      pdf_page: 1140
      parsed_lines: "33225-33240"
    text: '观此知虽诔晴雯实乃诔黛玉也试观证前缘回黛玉逝后诸文便知'
    text_sha256: 0f225b5d0f93256fbc93795f3ab4445be2c26c6020c83f1d6b3b165eeb633147
    transmission:
      original_status: LOST
      intermediary: 毛国瑶横行练习簿过录
    notes: “证前缘回”只按T2_W2弱回称处理，不升级为正式回目。

  - id: src:w2:jingcang:33:qingbang-confirmation
    type: EARLY_TRANSCRIPT
    tier: W2_TRANSCRIPT
    title: 毛国瑶抄录靖藏本第33条——观警幻情榜
    witness:
      siglum: JINGCANG_MAO_33
      label: 靖藏本批语（毛国瑶抄录）
      annotation: 第六回朱眉；原靖藏本已失
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      appendix: 3
      transcript_item: 33
      pdf_page: 1131
      parsed_lines: "32924-32939"
    text: '观警幻情榜方知余言不谬'
    text_sha256: 4f6b887a051307825bfa5b145e1f643e3a8fcb4e9e30e642a4d89b811b380438
    transmission:
      original_status: LOST
      intermediary: 毛国瑶横行练习簿过录
    notes: 只作为情榜存在的W2旁证；当前情榜硬约束必须继续由W1见证承担。
