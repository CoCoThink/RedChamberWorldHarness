sources:
  - id: src:gengchen:ch21:future-title-baochai-fengjie
    type: EARLY_COMMENT
    tier: W1_DIRECT
    title: 庚辰本第二十一回回前总评——后回宝钗凤姐完整题目
    witness:
      siglum: GENGCHEN
      label: 庚辰本
      annotation: 第二十一回回前总评；上下文以“庚有客题”起
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      chapter: 21
      parsed_lines: "8603-8619"
    text: '此曰“娇嗔箴宝玉”“软语救贾琏”，后曰“薛宝钗借词含讽谏，王熙凤知命强英雄”。'
    text_sha256: 326d95c16cfcc89051cea051f84fcefe93b838c0dc80fab310c12ec7dace0a99
    notes: 该证据支持完整未来回目文字；不支持本工程“第90回”的具体编号。

  - id: src:gengchen:ch20:xiren-prison-drafts
    type: EARLY_COMMENT
    tier: W1_SEEN
    title: 庚辰本第二十回眉批——袭人标目与狱神庙稿
    witness:
      siglum: GENGCHEN
      label: 庚辰本
      annotation: 庚眉；丁亥夏，畸笏叟；自述曾见誊清稿
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      chapter: 20
      parsed_lines: "8311-8324"
    text: '茜雪至“狱神庙”方呈正文。袭人正文标目曰“花袭人有始有终”，余只见有一次誊清时，与“狱神庙慰宝玉”等五六稿，被借阅者迷失，叹叹！丁亥夏。畸笏叟。'
    text_sha256: 32c3ec319cacd38a250240614677ef38604d603a0fd2d9f6c205aa97d226fa74
    notes: “花袭人有始有终”明称正文标目；“狱神庙慰宝玉”处在见过的稿件/稿名语境。

  - id: src:jiazxu:ch8:mistaken-theft
    type: EARLY_COMMENT
    tier: W1_DIRECT
    title: 甲戌本第八回夹批——误窃一回伏线
    witness:
      siglum: JIAXU
      label: 甲戌本
      annotation: 甲夹
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      chapter: 8
      parsed_lines: "3983-3996"
    text: '“塞玉”一段，又为“误窃”一回伏线。晴雯茜雪二婢，又为后文先作一引。'
    text_sha256: b3f86a33132d43d705e4c6b70dfee95d0817d00efcaf3adabdde4a2049698fd7
    notes: 支持后文“误窃”回称/接口；不能单独证明正式原回目或具体回次。

  - id: src:jimao:ch19:cold-winter-torn-felt
    type: EARLY_COMMENT
    tier: W1_DIRECT
    title: 己卯本第十九回夹批——寒冬酸虀破毡
    witness:
      siglum: JIMAO
      label: 己卯本
      annotation: 己夹
    container:
      ref: 红楼梦脂评汇校本 v3.1416_20251012_可复制.pdf
      sha256: 37441da3cb438d1b3eab2b511aa6f1695f309192fa63bea842413ff91655c1d7
    locator:
      chapter: 19
      parsed_lines: "7798-7813"
    text: '以此一句留与下部后数十回“寒冬噎酸虀，雪夜围破毡”等处对看，可为后生过分之戒。叹叹！'
    text_sha256: 8f13aa31390b83c666e277021a2e82ddad316d0617e2f970c3fb907661c2378d
    notes: 这是未来场景描述/T3，不是正式回目证据。
