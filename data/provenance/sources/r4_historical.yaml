schema_version: 1
sources:
- id: src:history:daqinglu:v36:outsider-access
  type: HISTORICAL_PRIMARY
  title: 《大清律例》卷三十六——限制外人入狱传话
  witness:
    siglum: DQLL-V36
    label: 《大清律例》卷三十六
    annotation: 刑律·断狱上·主守教囚反异
  bibliography:
    citation: 《大清律例》（四库全书本）卷三十六
    url: https://zh.wikisource.org/wiki/%E5%A4%A7%E6%B8%85%E5%BE%8B%E4%BE%8B_(%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC)/%E5%8D%B736
  locator:
    section: 主守教囚反异
    clause: 容纵外人入狱及传通言语
  text: 若獄官典卒容縱外人入獄及與囚傳通言語走泄事情於囚罪無增減者笞五十。
  text_sha256: 0fea940cb6f29deeb95b4d82ab7bbb84a389f49df38a76934065499ff6d3f2e5
  notes: 仅用于监狱出入/传话的历史边界；不能反推曹稿具体探视场景。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:daqinglu:v36:relative-visits
  type: HISTORICAL_PRIMARY
  title: 《大清律例》卷三十六——亲属入视与送饮食
  witness:
    siglum: DQLL-V36
    label: 《大清律例》卷三十六
    annotation: 刑律·断狱上·狱囚衣粮条例
  bibliography:
    citation: 《大清律例》（四库全书本）卷三十六
    url: https://zh.wikisource.org/wiki/%E5%A4%A7%E6%B8%85%E5%BE%8B%E4%BE%8B_(%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC)/%E5%8D%B736
  locator:
    section: 狱囚衣粮
    clause: 在监人犯亲属入视与送饮食
  text: 一在監人犯許令祖父母父母伯叔兄弟妻妾子孫一月兩次入視使役之人不越兩名若有送飲食者提牢官騐明禁子轉送。
  text_sha256: cbc23926456e162fe7435f775bebb9d92681b8b0e0700bd55b00aecd8878a025
  notes: 说明受控入视和验明转送机制；名单不包含“旧仆当然探监权”。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:daqinglu:v36:waiting-for-questioning
  type: HISTORICAL_PRIMARY
  title: 《大清律例》卷三十六——牵连待质
  witness:
    siglum: DQLL-V36
    label: 《大清律例》卷三十六
    annotation: 刑律·断狱上·狱囚衣粮条例
  bibliography:
    citation: 《大清律例》（四库全书本）卷三十六
    url: https://zh.wikisource.org/wiki/%E5%A4%A7%E6%B8%85%E5%BE%8B%E4%BE%8B_(%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC)/%E5%8D%B736
  locator:
    section: 狱囚衣粮
    clause: 五城司坊羁禁与牵连待质
  text: 一五城司坊羈禁人犯及刑部等衙門發交各司坊枷號及看守牽連待質等犯果係赤貧並無家屬送飯者每人每日給老米一升。
  text_sha256: a843e9eaa3c9c9e38840cbaf1f652eb69eef764ceeb0442fcbce7e537fef5c7e
  notes: 只支持“待质/候问”作为历史上可运行的羁留机制，不锁宝玉具体拘留日数。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:shuntianfu:prison-god
  type: HISTORICAL_PRIMARY
  title: 《光绪顺天府志》——监狱内狱神庙实例
  witness:
    siglum: GXS-TFZ
    label: 《光绪顺天府志》
    annotation: 地理志所载州署监狱实例；现代数字化容器
  bibliography:
    citation: 《光绪顺天府志》地理志四
    url: https://www.shidianguji.com/book/NLG312001063940/chapter/1l93wyyn97p5n
  locator:
    section: 州县衙署与监狱
    phrase: 狱神庙一间
  text: 監獄在大門內西向。舊分內外二監，乾隆三十年，知州萬廷蘭將外監歸併內監，現在囚房六間，女囚房一間，獄神廟一間，禁卒房一間，更夫房一間。
  text_sha256: 7c1ea2f9276c38b0a20c9ca50e6cc99ee82dc3cd172707ff4e2c485dad7e7f54
  notes: 只证明部分地方监狱可有狱神庙；不得泛化为每所监狱固定布局。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:cao:1728:inventory-seal
  type: HISTORICAL_PRIMARY
  title: 雍正六年隋赫德奏折——曹家房产什物造册封固
  witness:
    siglum: CAO-ARCHIVE-286
    label: 江宁织造隋赫德奏细查曹頫房地产及家人情形摺
    annotation: 雍正六年三月初二日
  bibliography:
    citation: 《曹家档案史料》二百八十六
    url: https://ctext.org/wiki.pl?chapter=962820&if=gb&remap=gb
  locator:
    document_no: 286
    date: 雍正六年三月初二日
    passage: 房产什物查清造册封固
  text: 總督范時繹已將曹頫家管事數人拿去夾訊監禁，所有房產什物一並查清，造冊封固。
  text_sha256: d06939424c76e94bd2fb28a914f3ac9a9430ac3ed93b73e228c58f664eb33b41
  notes: 与贾府社会层级/时代接近，但只能证明机制可行，不能把曹案程序逐项移植为贾府事实。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:cao:1728:pawn-tickets
  type: HISTORICAL_PRIMARY
  title: 雍正六年隋赫德奏折——旧衣什物与当票百余张
  witness:
    siglum: CAO-ARCHIVE-286
    label: 江宁织造隋赫德奏细查曹頫房地产及家人情形摺
    annotation: 雍正六年三月初二日
  bibliography:
    citation: 《曹家档案史料》二百八十六
    url: https://ctext.org/wiki.pl?chapter=962820&if=gb&remap=gb
  locator:
    document_no: 286
    date: 雍正六年三月初二日
    passage: 旧衣零星等件及当票百余张
  text: 餘則桌椅、床几、舊衣零星等件及當票百餘張外，並無別項，與總督所查冊內彷彿。
  text_sha256: db5d21610423a2f89ecb2de08c277d19d598877d2a89dc1d4b89fa60e637ddb8
  notes: 支持旧家衰败中长期典当作为现金流机制的历史可行性；不锁具体典当物。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:cao:1728:family-housing
  type: HISTORICAL_PRIMARY
  title: 雍正六年隋赫德奏折——曹家属少留房产养赡
  witness:
    siglum: CAO-ARCHIVE-286
    label: 江宁织造隋赫德奏细查曹頫房地产及家人情形摺
    annotation: 雍正六年三月初二日
  bibliography:
    citation: 《曹家档案史料》二百八十六
    url: https://ctext.org/wiki.pl?chapter=962820&if=gb&remap=gb
  locator:
    document_no: 286
    date: 雍正六年三月初二日
    passage: 少留房产以资养赡
  text: 至曹頫家屬，蒙恩諭少留房產以資養贍，今其家屬不久回京，奴才應將在京房屋人口酌量撥給，以彰聖主覆載之恩。
  text_sha256: f922887865a1abc1de4fdd49b7d354242a22cc3e4142f187ff3885f63fa7fe6e
  notes: 证明抄没后仍可能为家属保留/拨给有限居住资源；不是贾府具体住房证据。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:daqinglu:v10:mourning-marriage
  type: HISTORICAL_PRIMARY
  title: 《大清律例》卷十——居丧嫁娶
  witness:
    siglum: DQLL-V10
    label: 《大清律例》卷十
    annotation: 户律·婚姻·居丧嫁娶
  bibliography:
    citation: 《大清律例》（四库全书本）卷十
    url: https://zh.wikisource.org/wiki/%E5%A4%A7%E6%B8%85%E5%BE%8B%E4%BE%8B_(%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC)/%E5%8D%B710
  locator:
    section: 居丧嫁娶
  text: 凡男女居父母及妻妾居夫喪而身自嫁娶者杖一百。若居祖父母伯叔父母姑兄姊喪而嫁娶者杖八十。
  text_sha256: 0bcfb345739b828f866e940a48f44f4c2fac712e8642f94102e84deebadbadc1
  notes: 支持丧制会实际约束婚嫁；不能直接给元妃之丧计算宝玉宝钗唯一婚期。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:huidian:v89:huangguifei-mourning
  type: HISTORICAL_PRIMARY
  title: 《钦定大清会典则例》卷八十九——皇贵妃丧仪
  witness:
    siglum: HUIDIAN-V89
    label: 《钦定大清会典则例》卷八十九
    annotation: 礼部·祠祭清吏司·丧礼三·皇贵妃丧仪
  bibliography:
    citation: 《钦定大清会典则例》卷八十九
    url: https://ctext.org/wiki.pl?chapter=677909&if=gb&remap=gb
  locator:
    section: 皇贵妃丧仪
    case: 雍正三年敦肃皇贵妃
  text: 皇貴妃宮中女子內監皆剪髮截髮辮成服婣戚人等成服皆大祭日除服百日剃頭。
  text_sha256: 22e0f81ba328fbca9bfcab8179a3518565e7457f2e12ec68fe85c0049e44c621
  notes: 证明妃嫔丧礼对姻戚另有专门成服规则；“大祭日/百日”等不得被机械等同于小说唯一婚期。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:daqinglu:v10:marriage-authority
  type: HISTORICAL_PRIMARY
  title: 《大清律例》卷十——尊长主婚体系
  witness:
    siglum: DQLL-V10
    label: 《大清律例》卷十
    annotation: 户律·婚姻·男女婚姻条例
  bibliography:
    citation: 《大清律例》（四库全书本）卷十
    url: https://zh.wikisource.org/wiki/%E5%A4%A7%E6%B8%85%E5%BE%8B%E4%BE%8B_(%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC)/%E5%8D%B710
  locator:
    section: 男女婚姻
    clause: 嫁娶皆由祖父母父母主婚
  text: 一嫁娶皆由祖父母父母主婚祖父母父母俱無者從餘親主婚。
  text_sha256: 7e9a08a139dc844082a1ca3fb81ce09418e429393e1bb5388928430396c49c14
  notes: 只支持尊长/亲属主婚框架继续运作；不能决定贾母、王夫人、薛姨妈之间的具体谈判文本。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:history:beijing:1774:rental-contract
  type: HISTORICAL_PRIMARY
  title: 乾隆三十九年僧宗玉立租房契
  witness:
    siglum: BJ-RENT-1774
    label: 大觉寺藏清代契约文书
    annotation: 北京市文物局页面录文；乾隆三十九年六月初六日
  bibliography:
    citation: 北京市文物局《寺院土地田产的经营方式（中）》所录“乾隆三十九年僧宗玉立租房契”
    url: https://wwj.beijing.gov.cn/bjww/wwjzzcslm/1731063/1731066/djs/1731072/1731538/index.html
  locator:
    contract: 乾隆三十九年僧宗玉立租房契
    region: 今北京昌平一带
  text: 立租契人系瑞應寺下院當家宗玉，今有二拔子廟上鋪面房屋一所，共計十六間，今租沙河德春店作理生意。對眾言定每年租價清錢五十千正。
  text_sha256: 9c7b89292ea329157fe84f5ef33c184dd456f68fe253b99ad7c2abf046055fb8
  notes: 证明乾隆北京地区存在正式房屋租契与租价约定；该契为铺面房，不能证明贾家具体住宅院落或租价。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
- id: src:research:mao-liping:2013:natal-family
  type: SECONDARY_RESEARCH
  title: 毛立平《清代下层妇女与娘家的关系——以南部县档案为中心的研究》
  witness:
    siglum: MAO-2013-NANBU
    label: 毛立平论文
    annotation: 基于124件清代四川南部县衙门妇女案件
  bibliography:
    citation: 毛立平，《清代下层妇女与娘家的关系——以南部县档案为中心的研究》，《近代中国妇女史研究》第21期，2013年6月
    url: https://www.mh.sinica.edu.tw/MHDocument/PublicationDetail/PublicationDetail_1533.pdf
  locator:
    pages: 6-7
    topic: 出嫁女与娘家往来及互助局限
  text: 親情使得娘家與出嫁女仍保持密切往來，稍有餘力的娘家會對生活貧困的女兒女婿予以接濟；反之，若娘家貧困，女兒亦千方百計進行救助。另一方面，下層社會姻親之間的彼此救助頗具局限性。
  text_sha256: 4e098dfc89716c9b7ea1108c0a009db57fd68ab47029595c23fb3f8ae7a51efe
  notes: 二手研究且样本主要为四川下层妇女、年代多集中嘉道以后；只能软支持“娘家联系/有限援助渠道”，不能外推固定供养义务。
  locator_verification:
    status: UNVERIFIED
    reason: Imported locator assertion; extraction alignment not yet reconstructed.
