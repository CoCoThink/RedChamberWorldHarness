  text: 应了这话固好批书人焉能不心伤狱庙相逢之日始知遇难成祥逢凶化吉实伏线于千里哀哉伤哉此后文字不忍卒读辛卯冬日
  text_sha256: 885cbd3878a2c4bffc5f79c5aa8e8e74d192e23fc843036c5a7affea1475d277
  transmission:
    original_status: LOST
    intermediary: 毛国瑶横行练习簿过录
  notes: 只可作为狱庙/遇难成祥线的弱增权，不可单独承担人物、救援机制或回次锁定。
