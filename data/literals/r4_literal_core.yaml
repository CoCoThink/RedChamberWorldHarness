literal_constraints:
  - id: literal:ten-solitary-chants:name
    text: 十独吟
    targets: [NAME_EXACT, BOUNDARY]
    scope: WORK_NAME
    claim_refs: [claim:ten-solitary-chants:exists, claim:ten-solitary-chants:after-ch64]
    decision_refs: [decision:ten-solitary-chants:title-and-range]
    required_in_active_prose: true
    implementation_refs: [impl:active:ch85:ten-solitary-chants]
    boundary:
      description: 只能锁定在第64回之后；当前第85回为Implementation，不是源证回次。
      claim_ref: claim:ten-solitary-chants:after-ch64
    notes: 只锁作品名与“第64以后”；作者、诗体、篇数、对象仍OPEN。

