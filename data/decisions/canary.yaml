  - id: decision:zhen-sends-jade:event
    statement: 当前复原必须保留“甄宝玉送玉”的未来事件功能。
    based_on:
      - claim:zhen-sends-jade:event
    status: LOCKED
    reversible: false

  - id: decision:zhen-sends-jade:same-jade
    statement: 当前实现采用“所送为同一通灵玉”的模型，但证据未唯一锁定。
    based_on:
      - claim:zhen-sends-jade:event
      - claim:zhen-sends-jade:same-tongling-jade
    status: CURRENT
    reversible: true
    implementation_refs:
      - prose:active:ch98

  - id: decision:zhen-sends-jade:meeting
    statement: 当前实现让甄、贾二宝现实相见，但证据未要求必须以面对面形式完成。
    based_on:
      - claim:zhen-sends-jade:event
      - claim:zhen-sends-jade:face-to-face
    status: CURRENT
    reversible: true
    implementation_refs:
      - prose:active:ch98

  - id: decision:zhen-sends-jade:placement
    statement: 当前安置在第98回；具体回次属于工作安置。
    based_on:
      - claim:zhen-sends-jade:event
      - claim:zhen-sends-jade:chapter-98
    status: CURRENT
    reversible: true

  - id: decision:zhen-sends-jade:formal-title
    statement: 不把“甄宝玉送玉”升格为正式原回目，正式标题问题保持开放。
    based_on:
      - claim:zhen-sends-jade:formal-title
    status: OPEN
    reversible: true

  # Canary 3: 凤姐扫雪拾玉
  - id: decision:fengjie-snow-jade:event
    statement: 当前复原必须保留“凤姐扫雪拾玉”未来场景/事件功能。
    based_on:
