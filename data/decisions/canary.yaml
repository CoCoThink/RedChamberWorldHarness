decisions:
  # Canary 1: 悬崖撒手
  - id: decision:cliff-release:function
    statement: 宝玉后部弃妻婢而为僧的“悬崖撒手”功能属于不可违背方向。
    based_on:
      - claim:cliff-release:future-interface
      - claim:cliff-release:baoyu-abandons-and-becomes-monk
    status: LOCKED
    reversible: false
    project_refs:
      - 红楼梦八十回后全幅文学补完大工程计划_v6.0_R4最终放行版.md

  - id: decision:cliff-release:placement
    statement: 当前将“悬崖撒手”功能安置在第99回。
    based_on:
      - claim:cliff-release:future-interface
      - claim:cliff-release:chapter-99
    status: CURRENT
    reversible: true
    reasoning:
      - 为末回情榜与石归留出结构空间
      - 当前100回工作模型的章法安排
    implementation_refs:
      - prose:active:ch99

  - id: decision:cliff-release:formal-title
    statement: 是否存在正式原回目“悬崖撒手”保持开放，不把T2式回称升级为T0/T1。
    based_on:
      - claim:cliff-release:formal-title
    status: OPEN
    reversible: true

