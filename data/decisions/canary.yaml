    status: LOCKED
    reversible: false

  - id: decision:ten-solitary-chants:author
    statement: 《十独吟》作者保持开放。
    based_on:
      - claim:ten-solitary-chants:author
    status: OPEN
    reversible: true

  - id: decision:ten-solitary-chants:form
    statement: 《十独吟》具体诗体保持开放。
