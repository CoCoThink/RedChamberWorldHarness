  # Canary 5: 情榜
  - id: decision:qingbang:final-structure
    statement: 末回必须有情榜系统，并保留正、副、再副、三副、四副五层。
    based_on:
      - claim:qingbang:final-chapter
      - claim:qingbang:five-layers
    status: LOCKED
    reversible: false

  - id: decision:qingbang:baoyu-rating
    statement: 宝玉“情不情”为不可丢失的情榜硬锚。
    based_on:
      - claim:qingbang:baoyu-rating
    status: LOCKED
    reversible: false

  - id: decision:qingbang:daiyu-rating
    statement: 黛玉“情情”为不可丢失的情榜硬锚。
    based_on:
      - claim:qingbang:daiyu-rating
    status: LOCKED
    reversible: false

  - id: decision:qingbang:formal-title
    statement: 批语中的“警幻情榜”只作为Source原字保存，小说内正式总榜名保持开放。
    based_on:
      - claim:qingbang:source-phrase-jinghuan-qingbang
      - claim:qingbang:formal-total-title
    status: OPEN
    reversible: true

  - id: decision:qingbang:counts
    statement: 每层十二、总数六十均保持开放。
    based_on:
      - claim:qingbang:twelve-each-layer
      - claim:qingbang:sixty-total
    status: OPEN
    reversible: true

  - id: decision:qingbang:lower-rosters
    statement: 三副、四副完整名单保持开放，不从早期漫拟名单自动补全。
    based_on:
      - claim:qingbang:complete-lower-rosters
    status: OPEN
    reversible: true

  - id: decision:qingbang:current-format
    statement: 当前正文采用“一轴素榜 + 最小硬锚”的实现方式；该形式本身不是证据事实。
    based_on:
      - claim:qingbang:final-chapter
      - claim:qingbang:five-layers
      - claim:qingbang:formal-total-title
    status: CURRENT
    reversible: true
    implementation_refs:
      - prose:active:ch100
