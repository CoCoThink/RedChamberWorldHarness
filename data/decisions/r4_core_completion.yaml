decisions:
  - id: decision:daiyu:death-direction
    statement: 黛玉死亡方向属于不可违背的后部硬节点；具体第86回仍为工作安置。
    based_on: [claim:daiyu:death-direction]
    status: LOCKED
    constraint: MUST
    reversible: false
    implementation_refs: [impl:active:ch86:daiyu-death]

  - id: decision:prison:baoyu-interface
    statement: 后部必须兑现宝玉与狱神庙/羁押相关的实质叙事功能；罪由、天数、程序与空间形式不由此锁定。
    based_on:
      - claim:prison:comfort-baoyu:draft-label
      - claim:qianxue:prison-return
    status: LOCKED
    constraint: MUST
    reversible: false
    implementation_refs: [impl:active:ch92:hard-interfaces]

  - id: decision:xiaohong:great-help
    statement: 后部必须兑现小红对宝玉“大得力”的功能，但帮助方式、场次和回次保持可设计。
    based_on: [claim:xiaohong:great-help]
    status: LOCKED
    constraint: MUST
    reversible: false
    implementation_refs: [impl:active:ch92:hard-interfaces]

  - id: decision:qianxue:prison-return
    statement: 后部必须兑现茜雪在狱神庙相关线中的回流功能；具体探视资格和接触方式受H01边界约束。
    based_on: [claim:qianxue:prison-return]
    status: LOCKED
    constraint: MUST
    reversible: false
    implementation_refs: [impl:active:ch92:hard-interfaces]
