name: one-shot branch convergence cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-convergence]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical trunk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve historical refs as tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          preserve_tag () {
            tag="$1"
            sha="$2"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag exists: $tag"
            else
              git tag -a "$tag" "$sha" -m "Preserved before branch convergence cleanup"
              git push origin "refs/tags/$tag"
            fi
          }

          preserve_tag "archive/full-migration-v3-final-20261007" "a0ed1ea0da4db186f7c5f720a8585e77fe637fe7"
          preserve_tag "snapshot/full-migration-20261006" "c2247824cff14ef34ada87b2066297deebf6458f"
          preserve_tag "snapshot/self-contained-20261006" "241a4773dbe0da56a70f79db8a5bb39a6f807594"
          preserve_tag "quarantine/43-0-ch89-phase2-20261008" "69d406034960fc656ec1184425ae788ff18b6182"
          preserve_tag "milestone/p7-pass-v0.13" "f382bd506e836077e89c40b6ba4480035daf99e4"

      - name: Delete stale merged and archival branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feature/scenario-replay-v0.8"
            "feature/pareto-evaluation-v0.9"
            "feature/scenario-literary-stress-v0.10"
            "feature/narrative-discourse-v0.11"
            "feature/controlled-microdraft-v0.12"
            "feature/blind-microdraft-review-v0.13"
            "p3-pareto-v0.9-merge"
            "literary/43-0-ch89-phase2"
            "archive/full-migration-v3-final-20261007"
            "export/full-migration-snapshot-20261006"
            "export/self-contained-20261006"
            "literary/43-0-resume"
          )

          failed=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "deleting: $branch"
              if ! git push origin --delete "$branch"; then
                echo "::error::failed to delete $branch"
                failed=1
              fi
            else
              echo "already absent: $branch"
            fi
          done

          exit "$failed"
