name: rcw

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run rcw tests
        run: |
          if [ -d tests/rcw ]; then
            python -m pip install pytest pyyaml
            python -m pytest -q tests/rcw
          else
            echo "tests/rcw 尚未建立，跳过"
          fi
