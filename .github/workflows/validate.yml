name: RCWH validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: rcwh validate
      - name: Verify physical assets and immutable versions
        env:
          RCWH_ASSET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${RCWH_ASSET_BASE}:data/catalog/assets.yaml" 2>/dev/null; then
            rcwh assets validate --require-tracked --base-ref "$RCWH_ASSET_BASE"
          else
            rcwh assets validate --require-tracked
          fi
      - name: Smoke native foundation APIs
        run: |
          rcwh project status
          rcwh assets history
          rcwh sources trace decision:cliff-release:function
          rcwh self-contained check --profile asset-storage --require-tracked
          rcwh self-contained check --profile release-storage --require-tracked
      - name: Smoke domain runtimes
        run: |
          rcwh reconstruction summary
          rcwh reconstruction timeline 95
          rcwh world summary
          rcwh world character baoyu 92
          rcwh object continuity
          rcwh object jade --chapter 91
          rcwh literary-ecology summary
          rcwh literary-ecology voice daiyu
          rcwh literary-ecology chapter 92
          rcwh literary-ecology qingbang
          rcwh literary-ecology trace evidence A01
          rcwh implementation summary
          rcwh implementation stable
          rcwh implementation chapter 92
          rcwh implementation protection 89
          rcwh implementation competition 89
          rcwh implementation trace source asset:release:stable:v1.4:readable
          rcwh literary-production summary
          rcwh literary-production chapter 89
          rcwh knowledge summary
          rcwh knowledge scene ch92_delivery_gate --checkpoint K92-XIAOHONG-ASKS-GATE-RULES
          rcwh knowledge character ch86_last_night zijuan --checkpoint K86-ZIJUAN-SEES-RAPID-DECLINE
          rcwh knowledge voice xiaohong
          rcwh knowledge voice qianxue
          rcwh knowledge guard data/scenes/ch89_confiscation_message.yaml artifacts/43-0/ch89/candidates/ch89_B_full.md
          rcwh historical-adapter summary
          rcwh historical-adapter describe detention
          rcwh historical-adapter describe transport_letters
          rcwh historical-adapter scene data/scenes/ch86_last_night.yaml artifacts/43-0/ch86/candidates/ch86_B_light_full.md
          rcwh literary-suite summary
          rcwh literary-suite prose artifacts/43-0/ch89/candidates/ch89_B_full.md
          rcwh literary-suite blind comp:43-0:ch89:pressure-test
          rcwh literary-suite poetry-screen examples/literary/poetry_lane_A.txt examples/literary/poetry_lane_B.txt examples/literary/poetry_lane_C.txt
          rcwh literary-suite poetry-blind examples/literary/poetry_lane_A.txt examples/literary/poetry_lane_B.txt examples/literary/poetry_lane_C.txt
          rcwh prewrite summary
          rcwh prewrite corpus
          rcwh prewrite gap 86
          rcwh prewrite scenes 92
          rcwh prewrite step 40 --chapter 89
          rcwh prewrite contract 100
          rcwh prewrite stage 89
      - run: rcwh evaluate data/scenes/ch86_last_night.yaml examples/ch86_candidate_stub.txt
      - run: rcwh literary-evaluate plock:ch86:cold-medicine examples/literary/ch86_preserved.txt
      - name: Verify replacement-case exit code
        run: |
          set +e
          rcwh literary-evaluate plock:ch86:cold-medicine examples/literary/ch86_replacement_case.txt
          code=$?
          set -e
          test "$code" -eq 2
      - name: Verify explicit-drift blocker exit code
        run: |
          set +e
          rcwh literary-evaluate plock:ch86:cold-medicine examples/literary/ch86_blocked.txt
          code=$?
          set -e
          test "$code" -eq 1
      - run: rcwh literary-evaluate plock:ch86:cold-medicine artifacts/43-0/ch86/candidates/ch86_A_stable_full.md
      - run: rcwh literary-evaluate plock:ch86:cold-medicine artifacts/43-0/ch86/candidates/ch86_B_light_full.md
      - run: rcwh literary-evaluate plock:ch86:cold-medicine artifacts/43-0/ch86/candidates/ch86_C_strong_full.md
      - run: rcwh competition comp:43-0:ch86:pressure-test
      - run: rcwh literary-evaluate plock:ch89:small-life-after-confiscation artifacts/43-0/ch89/candidates/ch89_A_full.md
      - run: rcwh literary-evaluate plock:ch89:small-life-after-confiscation artifacts/43-0/ch89/candidates/ch89_B_full.md
      - run: rcwh literary-evaluate plock:ch89:small-life-after-confiscation artifacts/43-0/ch89/candidates/ch89_C_full.md
      - run: rcwh competition comp:43-0:ch89:pressure-test
      - run: rcwh promotion promotion:ch86:b:v1-5-candidate
      - run: pytest -q
