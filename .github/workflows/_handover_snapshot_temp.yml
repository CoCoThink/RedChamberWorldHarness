name: Temporary handover snapshot

on:
  push:
    branches:
      - literary/43-0-resume

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rcwh-current-repo-snapshot
          path: |
            .
            !.pytest_cache/**
            !**/__pycache__/**
          include-hidden-files: true
          retention-days: 1
